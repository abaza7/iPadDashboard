<!doctype html>
<html lang="en" data-theme="boho-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Dashboard</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="hijri" id="hijri"></div>
      <div class="chips"><div class="fx" id="fx" hidden></div><div class="fx gold" id="gold" hidden></div></div>
    </div>
    <div class="now">
      <div class="icon" id="wIcon"></div>
      <div class="temp" id="wTemp">--</div>
      <div class="desc" id="wDesc"></div>
      <div class="meta" id="wMeta"></div>
    </div>
  </div>
  <div class="forecast" id="forecast"></div>
  <div class="prayers" id="prayers"></div>
</div>

<input type="file" id="settingsFile" accept="application/json,.json" hidden>
<div class="corner" id="corner"><button class="chip" id="chip" type="button"></button><button class="qbtn" id="qbtn" type="button" aria-label="Quran player"></button><button class="qbtn" id="azbtn" type="button" aria-label="Morning Azkar">☀</button><button class="qbtn" id="rbtn" type="button" aria-label="Lofi radio"></button></div>
<div class="qmini rmini" id="rmini" hidden><button class="pb" id="rmPlay" type="button" aria-label="Play or pause"></button><div class="tx" id="rmOpen"><b id="rmT"></b><small id="rmS"></small></div></div>
<div class="qmini" id="qmini" hidden><button class="pb" id="qmPlay" type="button" aria-label="Play or pause"></button><div class="tx" id="qmOpen"><b id="qmT"></b><small id="qmS"></small></div><button class="qstopmini" id="qmStop" type="button" aria-label="Stop Quran and close player">&#215;</button><div class="mv qa" id="qmV"></div><div class="bar"><i id="qmBar"></i></div></div>
<div class="status" id="status"></div>
<div class="toast" id="toast" hidden></div>

<div class="panel" id="panel" hidden><div class="card" id="card"></div></div>
<div class="panel" id="qpanel" hidden><div class="card" id="qcard"></div></div>
<div class="panel" id="rpanel" hidden><div class="card" id="rcard"></div></div>
<div class="qread" id="qread" hidden></div>

<div class="alert" id="alert" hidden>
  <div class="ai">&#128332;</div>
  <div class="an" id="aName"></div>
  <div class="as" id="aSub"></div>
  <button class="btn pri" id="aBtn" type="button">Stop</button>
</div>


<div class="sleep" id="sleep" hidden><div class="sl-in"><div class="sl-clock" id="slClock"></div><div class="sl-next" id="slNext"></div></div></div>

<script src="js/core/shared.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/catalog.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/network.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/media-controller.js"></script>
<script src="js/core/status-projection.js"></script>
<script src="js/core/components.js"></script>
<script src="js/core/diagnostics.js"></script>
<script src="js/dashboard/index.js"></script>
<script src="js/azkar.js"></script>
</body>
</html>
