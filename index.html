<!doctype html>
<html lang="en" data-theme="boho-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Dashboard</title>
<style>
  @font-face { font-family: "Fraunces"; src: url(fonts/Fraunces.woff2) format("woff2"); font-weight: 300 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Fraunces"; src: url(fonts/Fraunces-Italic.woff2) format("woff2"); font-weight: 300 700; font-style: italic; font-display: swap; }
  @font-face { font-family: "Jost"; src: url(fonts/Jost.woff2) format("woff2"); font-weight: 300 600; font-style: normal; font-display: swap; }
  :root {
    /* Midnight (the original look) */
    --bg: #0b0f14; --fg: #e8eef5; --dim: #7d8a99; --card: #131a22; --accent: #5cc8ff;
    --next-bg: #0f2431; --next-border: #5cc8ff; --next-name: #5cc8ff; --next-time: #e8eef5; --next-count: #5cc8ff;
    --warn: #f2b84b; --warn-fg: #1b1303; --ok: #2fb36b; --ok-fg: #04170d;
    --pri: #5cc8ff; --pri-fg: #04202e;
    --panel: #161e28; --btn: #263241; --line: #222d3a; --btn-line: #33414f;
    --overlay: rgba(0, 0, 0, 0.7); --alert-bg: rgba(5, 12, 18, 0.94);
    --font-ui: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --font-clock: var(--font-ui); --clock-weight: 200;
    --past-op: 0.45; --night-op: 0.35;
    --glow: transparent; --glow2: transparent;
  }
  /* Boho: warm cream, terracotta, ochre, sage */
  html[data-theme="boho-light"] {
    --bg: #f6efe4; --fg: #3b2a20; --dim: #6b5545; --card: #ecdfca; --accent: #9c4a2b;
    --next-bg: #9a472a; --next-border: #9a472a; --next-name: #fff3e0; --next-time: #fffaf1; --next-count: #fff3e0;
    --warn: #e0b04a; --warn-fg: #2b1d05; --ok: #6f8a5f; --ok-fg: #0f1a0b;
    --pri: #9a472a; --pri-fg: #fff8ee;
    --panel: #f6efe4; --btn: #e6d6bd; --line: #d9c7aa; --btn-line: #c9b392;
    --overlay: rgba(59, 42, 32, 0.55); --alert-bg: rgba(246, 239, 228, 0.985);
    --ring1: #d9a441; --ring2: #c8714f; --glow: rgba(217, 164, 65, 0.22); --glow2: rgba(200, 113, 79, 0.12);
    --ic1: #a56a0a; --ic2: #4a3426; --ic3: #5f7a50;
    --clock-weight: 400; --past-op: 0.76; --night-op: 0.7;
  }
  /* Dark boho: deep brown, cream text, peach and ochre accents */
  html[data-theme="boho-dark"] {
    --bg: #231a17; --fg: #f4e8d4; --dim: #c4af97; --card: #34261f; --accent: #eca673;
    --next-bg: #e3955f; --next-border: #e3955f; --next-name: #2a1810; --next-time: #241209; --next-count: #2a1810;
    --warn: #e5b45a; --warn-fg: #241705; --ok: #8fae7e; --ok-fg: #0d170a;
    --pri: #e3955f; --pri-fg: #241209;
    --panel: #2c211c; --btn: #41322a; --line: #44342b; --btn-line: #5a463a;
    --overlay: rgba(0, 0, 0, 0.65); --alert-bg: rgba(25, 17, 14, 0.98);
    --ring1: #d9a441; --ring2: #c8714f; --glow: rgba(217, 164, 65, 0.10); --glow2: rgba(200, 113, 79, 0.10);
    --ic1: #e8b85a; --ic2: #f4e8d4; --ic3: #a5c494;
    --clock-weight: 400; --past-op: 0.7; --night-op: 0.6;
  }
  html[data-theme^="boho"] {
    --font-ui: "Jost", Optima, "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    --font-clock: "Fraunces", Baskerville, "Baskerville Old Face", Palatino, "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  html[data-theme^="boho"] body {
    background-image:
      radial-gradient(circle at 90% 6%, var(--glow), transparent 40%),
      radial-gradient(circle at 4% 98%, var(--glow2), transparent 36%);
    background-repeat: no-repeat;
  }
  button {
    font: inherit; color: inherit; border: 0; margin: 0;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .wrap, .chip, .status { transform: translate(var(--dx, 0px), var(--dy, 0px)); }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 4vmin 5vmin 8.5vmin;
    transition: opacity 1s, transform 60s linear;
  }
  .chip, .status { transition: transform 60s linear; }
  body.night .wrap { opacity: var(--night-op); }
  body.night .chip, body.night .status { opacity: 0.5; }

  /* ---------- top: clock + weather ---------- */
  .top {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 0;
  }
  .clock {
    font-family: var(--font-clock);
    font-size: 23.5vmin;
    font-weight: var(--clock-weight);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: lining-nums tabular-nums;
    white-space: nowrap;
  }
  .clock .sec { font-family: var(--font-ui); font-size: 7vmin; font-weight: 300; color: var(--dim); margin-left: 1.5vmin; letter-spacing: 0; }
  .clock .ampm { font-family: var(--font-ui); font-size: 6vmin; font-weight: 300; color: var(--dim); margin-left: 1.5vmin; letter-spacing: 0; }
  .date { margin-top: 2vmin; font-size: 4vmin; line-height: 1.2; color: var(--fg); }
  .hijri { margin-top: 0.8vmin; font-size: 3vmin; line-height: 1.2; color: var(--dim); }
  html[data-theme^="boho"] .date { font-family: var(--font-clock); font-style: italic; font-variant-numeric: lining-nums; }
  .fx {
    display: inline-block;
    margin-top: 1.6vmin;
    padding: 0.8vmin 2.2vmin;
    border-radius: 2vmin;
    background: var(--card);
    font-size: 3.1vmin;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  html[data-theme^="boho"] .fx { border-radius: 6vmin; padding: 0.8vmin 2.6vmin; }
  .chips .fx { display: block; width: -webkit-fit-content; width: fit-content; }
  .chips .fx + .fx { margin-top: 1vmin; }
  .fx .pair { color: var(--dim); margin-right: 1.4vmin; }
  .fx .karat { color: var(--dim); font-size: 2.5vmin; margin: 0 0.5vmin 0 0; }
  .fx .sepd { color: var(--dim); margin: 0 0.9vmin; }
  .fx .chg { color: var(--dim); margin-left: 1.2vmin; font-size: 2.6vmin; }

  .now { text-align: right; max-width: 44vmin; min-width: 0; }
  .now .icon { font-size: 16vmin; line-height: 1; }
  .now .temp { font-size: 14vmin; font-weight: 200; line-height: 1; margin-top: 1vmin; }
  .now .desc { font-size: 3.6vmin; color: var(--fg); margin-top: 1.2vmin; }
  .now .meta { font-size: 2.8vmin; color: var(--dim); margin-top: 0.8vmin; }
  /* boho: weather sits in an arch with rainbow-ring outlines */
  html[data-theme^="boho"] .now {
    flex: 0 0 auto;
    width: 41vmin;
    margin-right: 3.4vmin;
    padding: 4.6vmin 3vmin 2.2vmin;
    text-align: center;
    background: var(--card);
    border-radius: 999px 999px 3vmin 3vmin;
    box-shadow: 0 0 0 0.8vmin var(--bg), 0 0 0 1.3vmin var(--ring1), 0 0 0 2.1vmin var(--bg), 0 0 0 2.6vmin var(--ring2);
  }
  html[data-theme^="boho"] .now .temp { font-family: var(--font-clock); font-weight: 400; font-size: 9.5vmin; line-height: 0.95; margin-top: 0.4vmin; font-variant-numeric: lining-nums; }
  html[data-theme^="boho"] .now .desc { font-size: 3.2vmin; margin-top: 1vmin; }
  html[data-theme^="boho"] .now .meta { font-size: 2.5vmin; margin-top: 0.6vmin; }
  html[data-theme^="boho"] .top { padding-bottom: 3.4vmin; }
  html[data-theme^="boho"] .clock { font-size: 22vmin; }
  html[data-theme^="boho"] .date { margin-top: 1.4vmin; }
  html[data-theme^="boho"] .now .desc, html[data-theme^="boho"] .now .meta { line-height: 1.25; }
  html[data-theme^="boho"] .prayers { margin-top: 2.2vmin; }
  html[data-theme^="boho"] .fx { margin-top: 1.4vmin; }
  html[data-theme^="boho"] .now .meta span { display: block; }
  html[data-theme^="boho"] .now .meta .sep { display: none; }
  .ic { fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .ic .c1 { stroke: var(--ic1); }
  .ic .c2 { stroke: var(--ic2); }
  .ic .c3 { stroke: var(--ic3); }
  .ic .cf { fill: var(--card); }
  .now .icon svg { width: 10.4vmin; height: 10.4vmin; }
  html[data-theme^="boho"] .now .icon svg { width: 8.6vmin; height: 8.6vmin; }
  .fc .i svg { width: 5.4vmin; height: 5.4vmin; }

  /* ---------- forecast ---------- */
  .forecast { display: flex; margin: 0 -1vmin; }
  .fc {
    flex: 1 1 0;
    margin: 0 1vmin;
    background: var(--card);
    border-radius: 2.4vmin;
    padding: 1.8vmin 1vmin;
    text-align: center;
  }
  html[data-theme^="boho"] .fc { border-radius: 3.4vmin; border: 1px solid var(--line); padding: 1vmin 1vmin; }
  .fc .d { font-size: 2.6vmin; color: var(--dim); }
  .fc .i { font-size: 6vmin; line-height: 1.3; }
  .fc .t { font-size: 3vmin; }
  .fc .t span { color: var(--dim); }

  /* ---------- prayers ---------- */
  .prayers { display: flex; margin: 3vmin -0.8vmin 0; }
  .pr {
    position: relative;
    flex: 1 1 0;
    margin: 0 0.8vmin;
    border-radius: 2.4vmin;
    padding: 2vmin 1vmin;
    text-align: center;
    background: var(--card);
    border: 0.3vmin solid transparent;
  }
  html[data-theme^="boho"] .pr { border-radius: 10vmin 10vmin 2.4vmin 2.4vmin; padding: 4vmin 1vmin 1.5vmin; border: 1px solid var(--line); }
  .pr .n { font-size: 2.8vmin; color: var(--dim); }
  .pr .t { font-size: 5vmin; font-weight: 300; margin-top: 0.6vmin; font-variant-numeric: lining-nums tabular-nums; }
  html[data-theme^="boho"] .pr .t { font-family: var(--font-clock); font-weight: 400; }
  .pr.next { border-color: var(--next-border); background: var(--next-bg); }
  .pr.next .n { color: var(--next-name); }
  .pr.next .t { color: var(--next-time); }
  .pr.past { opacity: var(--past-op); }
  .pr .t .ap { font-family: var(--font-ui); font-size: 0.5em; font-weight: 400; margin-left: 0.3em; color: var(--dim); letter-spacing: 0.02em; }
  .pr.next .t .ap { color: var(--next-time); }
  .pr .c { font-size: 2.4vmin; color: var(--next-count); min-height: 3vmin; margin-top: 0.4vmin; }
  .pr .b { position: absolute; top: 0.8vmin; right: 1vmin; font-size: 2.2vmin; line-height: 1; }
  html[data-theme^="boho"] .pr .b { top: 1.6vmin; right: auto; left: 50%; margin-left: -1.1vmin; }
  @media (orientation: portrait) { html[data-theme^="boho"] .pr .b { top: 1.2vmin; } }

  /* ---------- corner widgets ---------- */
  .chip {
    position: fixed; left: 3vmin; bottom: 2vmin; z-index: 5;
    padding: 1.1vmin 2.2vmin;
    border-radius: 3vmin;
    background: var(--card);
    color: var(--dim);
    font-size: 2.4vmin;
  }
  .chip.warn { color: var(--warn-fg); background: var(--warn); }
  .status {
    position: fixed; right: 3vmin; bottom: 2.6vmin; z-index: 5;
    font-size: 2vmin; color: var(--dim);
  }

  /* ---------- settings panel ---------- */
  .panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--overlay);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 88vw; max-width: 110vmin; max-height: 92vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel); border-radius: 3vmin; padding: 3vmin 4vmin 4vmin;
    font-size: 3vmin;
  }
  .ph { display: flex; justify-content: space-between; align-items: center; font-size: 4.2vmin; font-weight: 600; margin-bottom: 2vmin; }
  .x { background: var(--btn); width: 7vmin; height: 7vmin; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .x svg { width: 55%; height: 55%; display: block; pointer-events: none; }
  .pm { min-height: 3.6vmin; color: var(--accent); font-size: 2.6vmin; margin-bottom: 1vmin; }
  .sec { margin: 3vmin 0 1vmin; color: var(--dim); font-size: 2.6vmin; text-transform: uppercase; letter-spacing: 0.08em; }
  .pills { display: flex; flex-wrap: wrap; margin: 0 -0.8vmin; }
  .sw { margin: 0.8vmin; padding: 1.8vmin 3.2vmin; border-radius: 6vmin; background: var(--btn); color: var(--dim); font-size: 3vmin; }
  .sw.on { background: var(--ok); color: var(--ok-fg); font-weight: 600; }
  .srow { display: flex; justify-content: space-between; align-items: center; padding: 1.6vmin 0; border-bottom: 1px solid var(--line); }
  .srow .sl { flex: 1 1 auto; min-width: 0; }
  .srow .sl b { display: block; font-weight: 600; }
  .srow .sl small { display: block; color: var(--dim); font-size: 2.3vmin; }
  .srow .sl em { display: block; font-style: normal; color: var(--accent); font-size: 2.6vmin; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb { flex: 0 0 auto; margin-left: 2vmin; }
  .btn { background: var(--btn); border-radius: 2vmin; padding: 1.6vmin 2.6vmin; font-size: 2.8vmin; margin-left: 1vmin; }
  .btn.pri { background: var(--pri); color: var(--pri-fg); font-weight: 600; }
  .btn.ghost { background: transparent; border: 1px solid var(--btn-line); }
  .filebtn { position: relative; display: inline-block; overflow: hidden; cursor: pointer; }
  .filebtn .fin { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; font-size: 100px; cursor: pointer; }
  .btns { margin-top: 3vmin; display: flex; flex-wrap: wrap; }
  .btns .btn { margin: 0 1.4vmin 1.4vmin 0; }
  .note { margin-top: 2vmin; color: var(--dim); font-size: 2.3vmin; line-height: 1.4; }

  /* ---------- night: black clock screen ---------- */
  .sleep {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 8;
    background: #000; display: flex; align-items: center; justify-content: center;
    text-align: center; cursor: pointer;
  }
  .sleep .sl-in { transform: translate(var(--dx, 0px), var(--dy, 0px)); transition: transform 60s linear; }
  .sleep .sl-clock { font-family: var(--font-clock); font-weight: var(--clock-weight); font-size: 26vmin; line-height: 1; color: #f4e8d4; opacity: 0.3; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
  .sleep .sl-clock .ampm { font-family: var(--font-ui); font-size: 6vmin; font-weight: 300; margin-left: 1.5vmin; letter-spacing: 0; }
  .sleep .sl-next { margin-top: 3vmin; font-size: 3.4vmin; color: #f4e8d4; opacity: 0.26; }
  .note a, .note code { word-break: break-all; color: var(--accent); font-style: normal; }
  .note .tp { display: block; font-size: 3.4vmin; color: var(--accent); letter-spacing: 0.04em; margin: 0.6vmin 0; }

  /* ---------- adhan alert ---------- */
  .alert {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--alert-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .alert .ai { font-size: 18vmin; line-height: 1; }
  .alert .an { font-family: var(--font-clock); font-size: 10vmin; font-weight: var(--clock-weight); margin-top: 2vmin; }
  .alert .as { font-size: 3.6vmin; color: var(--dim); margin-top: 1.5vmin; min-height: 4vmin; }
  .alert .btn { margin: 5vmin 0 0; padding: 2.4vmin 7vmin; font-size: 4vmin; }

  /* ---------- portrait ---------- */
  @media (orientation: portrait) {
    .top { flex-direction: column; justify-content: center; }
    .clock-block { text-align: center; }
    .clock, html[data-theme^="boho"] .clock { font-size: 18vmin; }
    .clock .sec { font-size: 6vmin; }
    .now { max-width: none; text-align: center; margin-top: 2.2vmin; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
    .now .icon { font-size: 9vmin; margin-right: 3vmin; }
    .now .temp { font-size: 10vmin; margin-top: 0; }
    .now .desc, .now .meta { flex: 0 0 100%; }
    html[data-theme^="boho"] .now { width: auto; margin-right: 0; padding: 0; border-radius: 0; box-shadow: none; background: none; border: 0; }
    html[data-theme^="boho"] .now .temp { font-size: 10vmin; }
    .now .icon svg { width: 10vmin; height: 10vmin; }
    html[data-theme^="boho"] .top { padding-bottom: 0; }
    html[data-theme^="boho"] .prayers { margin-top: 3vmin; }
    html[data-theme^="boho"] .fx { margin-top: 1.2vmin; }
    .chips { display: flex; justify-content: center; flex-wrap: wrap; }
    .chips .fx, .chips .fx + .fx { margin: 1.2vmin 0.6vmin 0; font-size: 2.8vmin; padding: 0.8vmin 1.8vmin; }
    .fx .karat { font-size: 2.3vmin; }
    .fx .pair { margin-right: 1vmin; }
    html[data-theme^="boho"] .now .meta { font-size: 2.3vmin; }
    html[data-theme^="boho"] .fc { padding: 0.8vmin 1vmin; }
    html[data-theme^="boho"] .now .ic .cf { fill: var(--bg); }
    html[data-theme^="boho"] .now .meta span { display: inline; }
    html[data-theme^="boho"] .now .meta .sep { display: inline; }
    .prayers { flex-wrap: wrap; }
    .pr { flex: 0 0 calc(33.33% - 1.6vmin); margin-bottom: 1.6vmin; padding: 1.4vmin 1vmin; }
    html[data-theme^="boho"] .pr { padding: 3.4vmin 1vmin 1.2vmin; }
    .pr .t { font-size: 4.6vmin; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="hijri" id="hijri"></div>
      <div class="chips"><div class="fx" id="fx" hidden></div><div class="fx gold" id="gold" hidden></div></div>
    </div>
    <div class="now">
      <div class="icon" id="wIcon"></div>
      <div class="temp" id="wTemp">--</div>
      <div class="desc" id="wDesc"></div>
      <div class="meta" id="wMeta"></div>
    </div>
  </div>
  <div class="forecast" id="forecast"></div>
  <div class="prayers" id="prayers"></div>
</div>

<button class="chip" id="chip" type="button"></button>
<div class="status" id="status"></div>

<div class="panel" id="panel" hidden><div class="card" id="card"></div></div>

<div class="alert" id="alert" hidden>
  <div class="ai">&#128332;</div>
  <div class="an" id="aName"></div>
  <div class="as" id="aSub"></div>
  <button class="btn pri" id="aBtn" type="button">Stop</button>
</div>


<div class="sleep" id="sleep" hidden><div class="sl-in"><div class="sl-clock" id="slClock"></div><div class="sl-next" id="slNext"></div></div></div>

<script>
(function () {
  "use strict";

  // ---------- config (override with URL params, e.g. ?city=Alexandria&lat=31.2&lon=29.95) ----------
  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var p = kv.split("=");
    q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || "").replace(/\+/g, " "));
  });
  var CFG = {
    city:   q.city   || "Cairo",
    lat:    q.lat    || "30.0444",
    lon:    q.lon    || "31.2357",
    tz:     q.tz     || "Africa/Cairo",
    method: q.method || "5",            // 5 = Egyptian General Authority of Survey
    units:  q.units  || "c",            // c or f
    h12:    q.h12 === "1",              // 12-hour clock
    secs:   q.secs !== "0",             // show seconds
    prayer: q.prayer !== "0",           // show prayer row
    fx:     q.fx !== "0",               // show exchange rate
    gold:   q.gold !== "0",             // show gold price per gram (needs the exchange rate)
    drift:  q.drift !== "0",            // slowly shift the layout a few pixels
    from:   (q.from || "USD").toUpperCase(),

    return new Promise(function (resolve, reject) {
      var done = false;

      fetch(url).then(function (r) {

      }).then(function (j) {

  var jobs = [];
  function addJob(label, fn, okMs) {
    var j = { label: label, fn: fn, okMs: okMs, timer: null, failing: false, running: false };
    j.run = function () {
      if (j.running) return;
      clearTimeout(j.timer);
      j.running = true;
      var p;
      try { p = fn(); } catch (e) { p = Promise.reject(e); }
      p.then(function () {
        j.failing = false; j.running = false;
        j.timer = setTimeout(j.run, j.okMs);
        updateStatus();
      }, function () {
        j.failing = true; j.running = false;
        j.timer = setTimeout(j.run, RETRY_MS);
        updateStatus();
      });
    };
    jobs.push(j);
    return j;
  }

  // ---------- exchange rate (free, no key; daily reference rate) ----------

    var el = $("fx");
    if (!CFG.fx || !fx || !(fx.rate > 0)) { el.hidden = true; renderGold(null); return; }
    var html = '<span class="pair">' + esc(fx.from) + "/" + esc(fx.to) + "</span>" + fx.rate.toFixed(2);
    if (typeof fx.prev === "number") {
      var diff = fx.rate - fx.prev;

      html += '<span class="chg">' + arrow + " " + Math.abs(diff).toFixed(2) + "</span>";
    }

  // gold per gram in the local currency: spot price from the same rates file (24k), 21k = 21/24 of it
  function renderGold(fx) {
    var el = $("gold");

    var g24 = fx.oz / OZ_G, g21 = g24 * 21 / 24;

  function fetchFX() {
    if (!CFG.fx) return Promise.resolve();
    var f = CFG.from.toLowerCase(), t = CFG.to.toLowerCase();
    var jsd = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@";
    function pick(j) {
      var rate = j && j[f] && j[f][t];
      if (typeof rate !== "number" || !(rate > 0)) throw new Error("bad rate");
      var xau = j[f].xau, oz = (typeof xau === "number" && xau > 0) ? rate / xau : 0;   // price of 1 troy oz in the local currency
      return { rate: rate, date: j.date || null, oz: oz };
    }
    function latest() {
      return getJSON(jsd + "latest/v1/currencies/" + f + ".json").then(pick)
        .catch(function () {
          return getJSON("https://latest.currency-api.pages.dev/v1/currencies/" + f + ".json").then(pick);
        })
        .catch(function () {
          return getJSON("https://open.er-api.com/v6/latest/" + CFG.from).then(function (j) {

  // ---------- prayer times (Aladhan monthly calendar, cached for offline use) ----------
  var prayerDays = load("pdays") || {};   // "DD-MM-YYYY" -> { t: {Fajr:"HH:MM",...}, h: "hijri text" }

  function prunePrayerDays() {
    var cut = new Date();

    Object.keys(prayerDays).forEach(function (k) {

  function parseDay(d) {
    var g = d && d.date && d.date.gregorian && d.date.gregorian.date;
    if (!g || !d.timings) return null;

    PRAYER_NAMES.forEach(function (name) {
      var m = /(\d{1,2}):(\d{2})/.exec(d.timings[name] || "");
      if (m) { t[name] = pad(+m[1]) + ":" + m[2]; n++; }
    });
    if (n < PRAYER_NAMES.length) return null;
    var h = d.date.hijri, htxt = "";
    if (h && h.month) htxt = parseInt(h.day, 10) + " " + (h.month.en || "") + " " + h.year + " AH";
    return { key: g, val: { t: t, h: htxt } };
  }

  function prayerParams() {
    return "latitude=" + CFG.lat + "&longitude=" + CFG.lon + "&method=" + CFG.method +

  function fetchMonth(y, m) {
    return getJSON("https://api.aladhan.com/v1/calendar/" + y + "/" + m + "?" + prayerParams()).then(function (r) {
      var out = {}, n = 0;
      (r && r.data || []).forEach(function (d) {
        var p = parseDay(d);
        if (p) { out[p.key] = p.val; n++; }
      });
      if (!n) throw new Error("bad calendar");

  }

  function fetchOneDay(d) {
    return getJSON("https://api.aladhan.com/v1/timings/" + dmy(d) + "?" + prayerParams()).then(function (r) {

  function fetchPrayer() {
    var now = new Date();

    var cur = fetchMonth(y, m).catch(function () {

      return Promise.all([fetchOneDay(now), fetchOneDay(tom)]).then(function (a) {

        Object.keys(a[1]).forEach(function (k) { o[k] = a[1][k]; });

      });
    });
    var next = fetchMonth(ny, nm).catch(function () { return {}; });
    return Promise.all([cur, next]).then(function (res) {
      [res[0], res[1]].forEach(function (mo) {
        Object.keys(mo).forEach(function (k) { prayerDays[k] = mo[k]; });

      prunePrayerDays();
      store("pdays", prayerDays);
      buildPrayer();

  function atTime(base, str) {

  function buildPrayer() {
    if (!CFG.prayer) return;
    var now = new Date();

    $("hijri").textContent = day ? day.h : "";
    var box = $("prayers");
    box.innerHTML = "";
    prayerEls = [];
    PRAYER_NAMES.forEach(function (name) {
      var tstr = day && day.t[name];
      var t = tstr ? atTime(now, tstr) : null;
      var el = document.createElement("div");
      el.className = "pr";
      el.innerHTML = '<div class="b"></div><div class="n">' + name + '</div><div class="t">' +

    } else if (c === "night" && NIGHT_MODES.indexOf(w[1]) >= 0) {
      nightMode = w[1]; store("nightmode", nightMode); wakeUntil = 0; renderClock();
      if (!$("panel").hidden) renderPanel();
      ack = "night screen: " + w[1];
    } else if (c === "sleep") { sleepForced = true; renderClock(); ack = "black screen on"; }
    else if (c === "wake") { sleepForced = false; wakeUntil = Date.now() + 30 * 60 * 1000; renderClock(); ack = "awake"; }
    else if (c === "alert" && w.length >= 3) {
      var nm = w[1].charAt(0).toUpperCase() + w[1].slice(1);
      if (ALERTABLE.indexOf(nm) >= 0 && (w[2] === "on" || w[2] === "off")) {
        alerts[nm] = w[2] === "on"; store("alerts", alerts);
        if (!$("panel").hidden) renderPanel();
        renderBells(); updateChip(); ack = nm + " alert " + w[2];
      }
    } else if (c === "refresh") { jobs.forEach(function (j) { j.run(); }); ack = "refreshing data"; }
    else if (c === "reload") { remoteSend("ack: reloading (tap the iPad once afterwards)"); setTimeout(function () { location.reload(); }, 800); return; }
    else if (c === "ping") { ack = "online " + hhmm(new Date()) + " · sound " + (unlocked ? "ready" : "needs a tap") + " · " + BUILD; }
    if (ack) remoteSend("ack: " + ack);
  }

  // ---------- start-up ----------
  prunePrayerDays();
  setRemote(q.remote || load("remote") || "");
  applyTheme();
  var cw = load("weather"); if (cw) renderWeather(cw);
  var cf = load("fx"); if (cf) renderFX(cf);
  buildPrayer();
  applyTheme();
  updateChip();
  loadSounds();

  renderClock();
  var lastDay = new Date().getDate();
  var prayerJob;
  setInterval(function () {
    var d = new Date();
    renderClock();
    applyTheme();
    checkAdhan(d);
    maybeAutoRefresh(d);
    if (d.getDate() !== lastDay) {          // new day: rebuild rows from cache, then refresh
      lastDay = d.getDate();
      buildPrayer();
      if (prayerJob) prayerJob.run();
    }
  }, 1000);
  setInterval(tickPrayer, 15000);

  addJob("weather", fetchWeather, 30 * 60 * 1000).run();
  if (CFG.fx) addJob("rates", fetchFX, 60 * 60 * 1000).run();
  if (CFG.prayer) { prayerJob = addJob("prayer times", fetchPrayer, 6 * 60 * 60 * 1000); prayerJob.run(); }

  // offline start: cache the page (and adhan files) with a service worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
